name: sync-bird-vendor

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync vendored bird-search
        run: ./scripts/sync_bird_vendor.sh
      - name: Open PR if upstream changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ -z "$(git status --porcelain -- src/reach_mcp/vendor/bird-search)" ]; then
            echo "upstream unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="chore/sync-bird-$(date -u +%Y%m%d)"
          git checkout -b "$branch"
          git add src/reach_mcp/vendor/bird-search
          git commit -m "chore: sync vendored bird-search from upstream"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: sync vendored bird-search" \
            --body "Automated sync from mvanhorn/last30days-skill (skills/last30days/scripts/lib/vendor/bird-search)."
